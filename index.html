<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de devoirs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --ink:#20241f;
    --paper:#f6f3ea;
    --paper-2:#ece6d4;
    --moss:#3f5d4a;
    --moss-dark:#2c4335;
    --clay:#a8492f;
    --amber:#c98a2c;
    --line: rgba(32,36,31,0.14);
    --danger:#a8492f;
  }
  *{box-sizing:border-box;}
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  header{
    margin-bottom:36px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2.4rem;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-size:0.95rem;
    color:var(--moss-dark);
    opacity:0.85;
  }

  .add-form{
    background:var(--paper-2);
    border-radius:4px;
    padding:20px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    margin-bottom:28px;
    border:1px solid var(--line);
  }
  .add-form input[type="text"]{
    grid-column: 1 / -1;
  }
  .field label{
    display:block;
    font-size:0.78rem;
    color:var(--moss-dark);
    margin-bottom:4px;
  }
  .field.full{ grid-column: 1 / -1; }
  input, select{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--moss);
  }
  .add-form button{
    grid-column: 1 / -1;
    justify-self:start;
    background:var(--moss);
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:3px;
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .add-form button:hover{ background:var(--moss-dark); }
  .hint{
    font-size:0.76rem;
    color:var(--moss-dark);
    opacity:0.75;
    margin-top:-4px;
  }

  .notif-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--amber);
    padding:12px 16px;
    border-radius:3px;
    margin-bottom:24px;
    font-size:0.88rem;
  }
  .notif-banner button{
    background:none;
    border:1px solid var(--moss);
    color:var(--moss-dark);
    padding:6px 12px;
    border-radius:3px;
    font-size:0.82rem;
    cursor:pointer;
    white-space:nowrap;
  }

  .subject-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:8px;
  }
  .subject-tabs::-webkit-scrollbar{ height:4px; }
  .tab-btn{
    flex-shrink:0;
    background:#fff;
    border:1px solid var(--line);
    color:var(--moss-dark);
    padding:6px 13px;
    border-radius:14px;
    font-size:0.82rem;
    font-family:'Work Sans', sans-serif;
    cursor:pointer;

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de devoirs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --ink:#20241f;
    --paper:#f6f3ea;
    --paper-2:#ece6d4;
    --moss:#3f5d4a;
    --moss-dark:#2c4335;
    --clay:#a8492f;
    --amber:#c98a2c;
    --line: rgba(32,36,31,0.14);
    --danger:#a8492f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  header{
    margin-bottom:36px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2.4rem;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-size:0.95rem;
    color:var(--moss-dark);
    opacity:0.85;
  }

  .add-form{
    background:var(--paper-2);
    border-radius:4px;
    padding:20px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    margin-bottom:40px;
    border:1px solid var(--line);
  }
  .add-form input[type="text"]{
    grid-column: 1 / -1;
  }
  .field label{
    display:block;
    font-size:0.78rem;
    color:var(--moss-dark);
    margin-bottom:4px;
  }
  input, select{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--moss);
  }
  .add-form button{
    grid-column: 1 / -1;
    justify-self:start;
    background:var(--moss);
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:3px;
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .add-form button:hover{ background:var(--moss-dark); }

  .notif-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--amber);
    padding:12px 16px;
    border-radius:3px;
    margin-bottom:24px;
    font-size:0.88rem;
  }
  .notif-banner button{
    background:none;
    border:1px solid var(--moss);
    color:var(--moss-dark);
    padding:6px 12px;
    border-radius:3px;
    font-size:0.82rem;
    cursor:pointer;
    white-space:nowrap;
  }

  .section-label{
    font-size:0.78rem;
    text-transform:none;
    color:var(--moss-dark);
    margin: 28px 0 10px;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }

  .task{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
  }
  .task.done{ opacity:0.45; }
  .task.done .task-title{ text-decoration: line-through; }

  .check{
    width:20px; height:20px;
    border:1.5px solid var(--moss);
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    flex-shrink:0;
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12px;
  }
  .task.done .check{ background:var(--moss); }

  .task-body{ flex:1; min-width:0; }
  .task-title{
    font-size:1rem;
    margin-bottom:3px;
    word-break:break-word;
  }
  .task-meta{
    font-size:0.8rem;
    color:var(--moss-dark);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .badge{
    font-size:0.72rem;
    padding:2px 8px;
    border-radius:10px;
    border:1px solid currentColor;
  }
  .badge.overdue{ color:var(--danger); }
  .badge.soon{ color:var(--amber); }
  .badge.ok{ color:var(--moss); }

  .remove-btn{
    background:none;
    border:none;
    color:var(--ink);
    opacity:0.35;
    cursor:pointer;
    font-size:1.1rem;
    line-height:1;
    padding:2px 6px;
    flex-shrink:0;
  }
  .remove-btn:hover{ opacity:0.8; color:var(--danger); }

  .empty{
    padding:30px 4px;
    color:var(--moss-dark);
    opacity:0.7;
    font-size:0.92rem;
  }

  .loading{
    padding:20px 4px;
    color:var(--moss-dark);
    font-size:0.9rem;
  }

  @media (max-width:520px){
    .add-form{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Carnet de devoirs</h1>
    <div class="subtitle">Ajoute un devoir avec sa date d'échéance — l'appli te previent quand elle approche.</div>
  </header>

  <div id="notifBanner" class="notif-banner">
    <span>Active les notifications pour recevoir un rappel même si tu n'as pas cet onglet ouvert.</span>
    <button id="enableNotif">Activer</button>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="titleInput" placeholder="Nom du devoir (ex. Dissertation d'histoire)" required>
    <div class="field">
      <label for="dateInput">Date d'échéance</label>
      <input type="date" id="dateInput" required>
    </div>
    <div class="field">
      <label for="timeInput">Heure (optionnel)</label>
      <input type="time" id="timeInput">
    </div>
    <button type="submit">Ajouter le devoir</button>
  </form>

  <div id="loading" class="loading">Chargement de tes devoirs…</div>
  <div id="listContainer" style="display:none;">
    <div class="section-label">À faire</div>
    <div id="pendingList"></div>
    <div class="section-label">Terminés</div>
    <div id="doneList"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'homework-tasks';
let tasks = [];
let notifiedIds = new Set();

async function loadTasks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    tasks = raw ? JSON.parse(raw) : [];
  }catch(e){
    tasks = [];
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('listContainer').style.display = 'block';
  render();
}

async function saveTasks(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }catch(e){
    console.error('Erreur de sauvegarde', e);
  }
}

function dueDateTime(task){
  return new Date(task.date + 'T' + (task.time || '23:59'));
}

function formatRelative(due){
  const now = new Date();
  const diffMs = due - now;
  const diffH = diffMs / 3600000;
  if(diffMs < 0) return {label:'En retard', cls:'overdue'};
  if(diffH <= 24) return {label:'Aujourd\u2019hui / demain', cls:'soon'};
  if(diffH <= 72) return {label:'Dans ' + Math.ceil(diffH/24) + ' j', cls:'soon'};
  const days = Math.ceil(diffH/24);
  return {label:'Dans ' + days + ' j', cls:'ok'};
}

function formatDate(task){
  const d = dueDateTime(task);
  const opts = {day:'numeric', month:'long'};
  let str = d.toLocaleDateString('fr-FR', opts);
  if(task.time) str += ' à ' + task.time;
  return str;
}

function render(){
  const pendingList = document.getElementById('pendingList');
  const doneList = document.getElementById('doneList');
  pendingList.innerHTML = '';
  doneList.innerHTML = '';

  const sorted = [...tasks].sort((a,b) => dueDateTime(a) - dueDateTime(b));
  const pending = sorted.filter(t => !t.done);
  const done = sorted.filter(t => t.done);

  if(pending.length === 0){
    pendingList.innerHTML = '<div class="empty">Rien à faire pour l\u2019instant. Ajoute ton premier devoir ci-dessus.</div>';
  }
  pending.forEach(t => pendingList.appendChild(renderTask(t)));

  if(done.length === 0){
    doneList.innerHTML = '<div class="empty">Aucun devoir terminé pour le moment.</div>';
  }
  done.forEach(t => doneList.appendChild(renderTask(t)));
}

function renderTask(task){
  const el = document.createElement('div');
  el.className = 'task' + (task.done ? ' done' : '');

  const check = document.createElement('div');
  check.className = 'check';
  check.textContent = task.done ? '✓' : '';
  check.onclick = () => toggleDone(task.id);

  const body = document.createElement('div');
  body.className = 'task-body';

  const title = document.createElement('div');
  title.className = 'task-title';
  title.textContent = task.title;

  const meta = document.createElement('div');
  meta.className = 'task-meta';
  const dateSpan = document.createElement('span');
  dateSpan.textContent = formatDate(task);
  meta.appendChild(dateSpan);

  if(!task.done){
    const rel = formatRelative(dueDateTime(task));
    const badge = document.createElement('span');
    badge.className = 'badge ' + rel.cls;
    badge.textContent = rel.label;
    meta.appendChild(badge);
  }

  body.appendChild(title);
  body.appendChild(meta);

  const removeBtn = document.createElement('button');
  removeBtn.className = 'remove-btn';
  removeBtn.textContent = '×';
  removeBtn.title = 'Supprimer';
  removeBtn.onclick = () => removeTask(task.id);

  el.appendChild(check);
  el.appendChild(body);
  el.appendChild(removeBtn);
  return el;
}

function toggleDone(id){
  const t = tasks.find(t => t.id === id);
  if(t){ t.done = !t.done; saveTasks(); render(); }
}

function removeTask(id){
  tasks = tasks.filter(t => t.id !== id);
  saveTasks(); render();
}

document.getElementById('addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const title = document.getElementById('titleInput').value.trim();
  const date = document.getElementById('dateInput').value;
  const time = document.getElementById('timeInput').value;
  if(!title || !date) return;
  tasks.push({
    id: 'task_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    title, date, time, done:false
  });
  saveTasks();
  render();
  e.target.reset();
});

// --- Rappels ---
function checkReminders(){
  const now = new Date();
  tasks.forEach(task => {
    if(task.done) return;
    const due = dueDateTime(task);
    const diffH = (due - now) / 3600000;
    // rappel dans les dernières 24h avant l'échéance
    if(diffH > 0 && diffH <= 24 && !notifiedIds.has(task.id)){
      notifiedIds.add(task.id);
      sendNotification(task, diffH);
    }
  });
}

function sendNotification(task, diffH){
  const timeLeft = diffH < 1 ? 'moins d\u2019une heure' : Math.round(diffH) + ' h';
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification('Devoir bientôt à rendre', {
      body: task.title + ' — dans ' + timeLeft
    });
  }
}

// bandeau d'activation des notifications
function setupNotifBanner(){
  const banner = document.getElementById('notifBanner');
  if('Notification' in window && Notification.permission === 'default'){
    banner.style.display = 'flex';
  }
  document.getElementById('enableNotif').onclick = () => {
    if('Notification' in window){
      Notification.requestPermission().then(() => {
        banner.style.display = 'none';
      });
    }
  };
}

setupNotifBanner();
loadTasks();
setInterval(checkReminders, 60000);
setInterval(render, 60000);
</script>
</body>
</html>
